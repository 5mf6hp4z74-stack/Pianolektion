offset+=share});const list=$('parts');list.replaceChildren();parts.forEach((p,i)=>{const b=document.createElement('button');b.className='part'+(idx===i&&!done?' active':'');const dot=document.createElement('span');dot.className='dot';dot.style.background=p.color;const t=document.createElement('span');const title=document.createElement('strong');title.textContent=p.name;const sub=document.createElement('span');sub.className='small';sub.textContent=p.min+' minuter';t.append(title,sub);b.append(dot,t);b.onclick=()=>jump(i);list.append(b)})}function stop(){run=false;if(ticker)clearInterval(ticker);ticker=null}function beep(){if(!sound)return;try{const A=window.AudioContext||window.webkitAudioContext;if(!A)return;audio=audio||new A();audio.resume();const o=audio.createOscillator(),g=audio.createGain();o.connect(g);g.connect(audio.destination);o.frequency.value=880;g.gain.setValueAtTime(.07,audio.currentTime);g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+.25);o.start();o.stop(audio.currentTime+.25)}catch{}}function fire(){if(!fx)return;const holder=$('fire');holder.replaceChildren();const colors=parts.map(p=>p.color);for(let b=0;b<7;b++){let x=12+Math.random()*76,y=10+Math.random()*60;for(let i=0;i<24;i++){const el=document.createElement('span');el.className='spark';const angle=i*Math.PI/12,r=50+Math.random()*110;for(const [k,v] of Object.entries({'--x':x+'%','--y':y+'%','--dx':Math.cos(angle)*r+'px','--dy':Math.sin(angle)*r+'px','--c':colors[(i+b)%colors.length],'--delay':b*.33+'s'}))el.style.setProperty(k,v);holder.append(el)}}setTimeout(()=>holder.replaceChildren(),4600)}function finish(){stop();done=true;left=0;draw();beep();showEnd(false)}function jump(i){const was=run;stop();done=false;hideEnd();$('fire').replaceChildren();idx=i;left=parts[i].min*60;if(was){run=true;deadline=Date.now()+left*1000;ticker=setInterval(tick,250)}draw();sync()}function tick(){if(!run)return;const now=Date.now();while(run&&now>=deadline){beep();if(idx===parts.length-1){finish();return}idx++;deadline+=parts[idx].min*60000}left=Math.max(0,Math.ceil((deadline-now)/1000));draw()}$('play').onclick=()=>{if(done){jump(0);return}if(run){left=Math.max(0,Math.ceil((deadline-Date.now())/1000));stop()}else{run=true;deadline=Date.now()+left*1000;ticker=setInterval(tick,250)}draw()};$('next').onclick=()=>idx===parts.length-1?finish():jump(idx+1);$('prev').onclick=()=>done?jump(parts.length-1):idx>0&&jump(idx-1);$('finish').onclick=finish;$('reset').onclick=()=>{stop();done=false;hideEnd();left=parts[idx].min*60;draw()};$('focus').onclick=()=>{root.classList.toggle('focus');$('focus').textContent=root.classList.contains('focus')?'✕ Avsluta fokus':'⛶ Fokus'};$('sound').onclick=()=>{sound=!sound;$('sound').textContent=sound?'🔔 Ljud på':'🔕 Ljud av'};$('fx').onclick=()=>{fx=!fx;$('fx').textContent=fx?'🎆 Fyrverkerier på':'🎆 Fyrverkerier av'};function sync(){const p=parts[idx];$('ename').value=p.name;$('emin').value=p.min;$('ecolor').value=p.color;$('delete').disabled=parts.length===1}$('edit').onclick=()=>{$('editor').classList.toggle('hidden');sync()};$('save').onclick=()=>{stop();done=false;const min=Math.max(1,Math.min(180,Math.round(Number($('emin').value)||1)));parts[idx]={name:$('ename').value.trim()||'Moment',min,color:$('ecolor').value};left=min*60;persist();draw()};$('add').onclick=()=>{stop();done=false;parts.push({name:'Nytt moment',min:5,color:'#baa2f5'});idx=parts.length-1;left=300;$('editor').classList.remove('hidden');persist();draw();sync()};$('delete').onclick=()=>{if(parts.length<2)return;stop();done=false;parts.splice(idx,1);idx=Math.min(idx,parts.length-1);left=parts[idx].min*60;persist();draw();sync()};$('photo').onclick=()=>$('photoInput').click();$('photoInput').onchange=e=>{const file=e.target.files?.[0];if(!file)return;const url=URL.createObjectURL(file);$('back').style.backgroundImage=`url("${url}")`;document.querySelector('.dial').style.setProperty('--custom-photo',`url("${url}")`)};$('profileSelect').onchange=()=>changeProfile($('profileSelect').value);
$('newProfile').onclick=()=>{const name=prompt('Namn på elev eller lektionsupplägg:','Ny elev');if(!name?.trim())return;saveAll();const p={id:uniqueId(),name:name.trim(),parts:baseParts(),end:null};profiles.push(p);activeId=p.id;parts=p.parts.map(x=>({...x}));stop();done=false;hideEnd();idx=0;left=parts[0].min*60;saveAll();updateProfileList();loadEndSettings();draw();sync()};
$('copyProfile').onclick=()=>{const name=prompt('Namn på kopian:',currentProfile().name+' – kopia');if(!name?.trim())return;saveAll();const p={id:uniqueId(),name:name.trim(),parts:baseParts(),end:currentProfile().end?{...currentProfile().end}:null};profiles.push(p);activeId=p.id;parts=p.parts.map(x=>({...x}));stop();done=false;hideEnd();idx=0;left=parts[0].min*60;saveAll();updateProfileList();loadEndSettings();draw();sync()};
$('renameProfile').onclick=()=>{const name=prompt('Nytt namn:',currentProfile().name);if(!name?.trim())return;currentProfile().name=name.trim();saveAll();updateProfileList()};

$('customEnd').onchange=()=>{$('customFields').classList.toggle('hidden',!$('customEnd').checked)};
$('saveEnd').onclick=()=>{saveEndSettings();alert('Avslutningen är sparad!')};

updateProfileList();loadEndSettings();
